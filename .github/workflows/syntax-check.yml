name: C++ syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check template.cpp first
        run: g++ -std=c++26 -fsyntax-only template.cpp

      - name: Check each template with template.cpp
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name '*.cpp' \
            ! -path './.git/*' \
            ! -path './template.cpp' \
            -print0 |
            xargs -0 -r -n1 -P "$(nproc)" bash -c '
              set -euo pipefail
              file="$1"
              combined="$(mktemp ./.syntax-check.XXXXXX.cpp)"
              trap '\''rm -f "$combined"'\'' EXIT

              cat template.cpp "$file" > "$combined"
              echo "Checking: $file"
              g++ -std=c++26 -fsyntax-only "$combined"
            ' _
